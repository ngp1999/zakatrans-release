name: ZakaTrans Build (Xcode)

# 真实 Xcode 编译：能力检查 → xcodegen 生成工程 → 自动签名归档 → 导出 ipa → 校验 → 上传 TestFlight
#
# 为什么会有「能力检查」这一步：
# 之前工程里 target 级写着 CODE_SIGN_STYLE: Manual + CODE_SIGN_IDENTITY: ""，
# Xcode 归档时直接跳过签名，二进制里一个 entitlement 都没有，
# 结果 TestFlight 上点「通过 Apple 登录」报 ASAuthorizationError 1000。
# 现在固定真签名，并且上传前用 codesign 读回来核对，缺了就当场失败。
on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "版本号（必须高于 TestFlight 上已有的最高版本，如 3.5.1）"
        required: false
        default: "3.5.1"
      upload:
        description: "上传到 TestFlight（true/false）"
        required: false
        default: "true"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 选最新的 Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: 安装 xcodegen
        run: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version

      - name: 准备 API 密钥
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          [ -n "${ASC_KEY_P8:-}" ] || { echo "❌ 没填 ASC_KEY_P8"; exit 1; }
          [ -n "${ASC_KEY_ID:-}" ] || { echo "❌ 没填 ASC_KEY_ID"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys" "$HOME/.appstoreconnect/private_keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          : > "$KEY"
          for FLAG in -D -d --decode; do
            if printf '%s' "$ASC_KEY_P8" | base64 "${FLAG}" > "$KEY" 2>/dev/null \
               && grep -q "BEGIN PRIVATE KEY" "$KEY"; then
              break
            fi
          done
          grep -q "BEGIN PRIVATE KEY" "$KEY" || printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          cp "$KEY" "$HOME/.appstoreconnect/private_keys/"
          echo "ASC_KEY_FILE=$KEY" >> "$GITHUB_ENV"

      - name: 确保 App ID 开好 Sign in with Apple / App Groups
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 ios/tools/ensure_capabilities.py

      - name: 清理多余的分发证书
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 ios/tools/revoke_extra_certs.py

      - name: 生成工程
        working-directory: ios
        run: |
          xcodegen generate
          grep -n "CODE_SIGN" ZakaTrans.xcodeproj/project.pbxproj | head -20 || true

      - name: 归档（真签名）
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MV: ${{ github.event.inputs.marketing_version }}
        run: |
          set -euo pipefail
          BUILD_NO="$(date +%s)"
          echo "BUILD_NO=$BUILD_NO" >> "$GITHUB_ENV"
          # 版本号：没传就用 project.yml 里的；传了但不高于 project.yml 的一律以 project.yml 为准。
          # 原因：TestFlight 按版本号排序，传低版本会被已有高版本盖住，用户装到的还是旧版。
          FILE_MV="$(sed -n 's/.*MARKETING_VERSION: "\(.*\)".*/\1/p' ios/project.yml | head -1)"
          MV_FINAL="${MV:-$FILE_MV}"
          if [ "$(printf '%s\n%s\n' "$MV_FINAL" "$FILE_MV" | sort -V | tail -1)" != "$MV_FINAL" ]; then
            echo "⚠️ 传入版本号 ${MV_FINAL} 低于 project.yml 的 ${FILE_MV}，改用 ${FILE_MV}"
            MV_FINAL="$FILE_MV"
          fi
          echo "📦 本次构建版本号 = $MV_FINAL"
          echo "MV_FINAL=$MV_FINAL" >> "$GITHUB_ENV"
          xcodebuild -project ios/ZakaTrans.xcodeproj \
            -scheme ZakaTrans \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ZakaTrans.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_FILE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$MV_FINAL" \
            CURRENT_PROJECT_VERSION="$BUILD_NO" \
            DEVELOPMENT_TEAM=9VSZ8M2JL5 \
            CODE_SIGN_STYLE=Automatic \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log"
          test ${PIPESTATUS[0]} -eq 0

      - name: 校验归档产物里的 entitlement
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ZakaTrans.xcarchive/Products/Applications/ZakaTrans.app"
          ls -la "$APP" | head -20
          python3 ios/tools/verify_entitlements.py "$APP" --allow-dev

      - name: 导出 ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ZakaTrans.xcarchive" \
            -exportPath "$RUNNER_TEMP/out" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_FILE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/out"

      - name: 校验导出 ipa 里的 entitlement
        run: |
          set -euo pipefail
          IPA="$(ls "$RUNNER_TEMP"/out/*.ipa | head -1)"
          rm -rf "$RUNNER_TEMP/unzip" && mkdir -p "$RUNNER_TEMP/unzip"
          unzip -q "$IPA" -d "$RUNNER_TEMP/unzip"
          APP="$RUNNER_TEMP/unzip/Payload/ZakaTrans.app"
          python3 ios/tools/verify_entitlements.py "$APP"
          echo "--- embedded.mobileprovision ---"
          security cms -D -i "$APP/embedded.mobileprovision" | plutil -convert xml1 -o - - | grep -A3 "Entitlements" | head -40 || true

      - name: 上传 TestFlight
        if: ${{ github.event.inputs.upload != 'false' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(ls "$RUNNER_TEMP"/out/*.ipa | head -1)"
          echo "上传 $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --verbose

      - name: 留存 ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZakaTrans-ipa
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: warn
          retention-days: 14
