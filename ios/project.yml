name: ZakaTrans
options:
  bundleIdPrefix: com.zakatrans
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "9VSZ8M2JL5"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GCC_OPTIMIZATION_LEVEL: "s"

targets:
  ZakaTrans:
    type: application
    platform: iOS
    sources:
      - path: ZakaTrans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakatrans.app
        PRODUCT_NAME: ZakaTrans
        INFOPLIST_FILE: ZakaTrans/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZakaTrans/Resources/ZakaTrans.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ZakaTrans/Engine/ZakaTrans-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: Broadcast
        embed: true
    info:
      path: ZakaTrans/Resources/Info.plist

  Broadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      # 扩展也要用共享存储（App Group / 心跳 / PCM 落盘），原工程就是这么带的
      - path: ZakaTrans/Engine/Shared.m
      - path: ZakaTrans/Engine/Shared.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakatrans.app.ext
        PRODUCT_NAME: Broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Broadcast/Broadcast.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: Broadcast/Info.plist
